<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404 — Record Unavailable | 404TN</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #090a0d;
      --surface: #12141a;
      --border: #1f2430;
      --bone: #e5e7eb;
      --crimson: #991b1b;
      --crimson-light: #ef4444;
      --meta: #9ca3af;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--bone);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--crimson);
      max-width: 580px;
      width: 100%;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--crimson-light);
      background: rgba(153, 27, 27, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.25rem 0.75rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 1rem;
      color: #fff;
    }
    p {
      color: var(--meta);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.75rem 1.5rem;
      background: #1f2430;
      color: #fff;
      border: 1px solid #374151;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn:hover {
      background: var(--crimson);
      border-color: var(--crimson-light);
    }
    .footer-meta {
      margin-top: 2rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">HTTP 404 — RECORD UNAVAILABLE</div>
    <h1>Document Not Found or Restricted</h1>
    <p>The requested investigative record, dossier route, or resource identifier does not exist or has been archived in the 404TN repository baseline.</p>
    <a href="/" class="btn">Return to Primary Monitor</a>
    <div class="footer-meta">404TN INDEPENDENT INVESTIGATIVE PLATFORM &bull; TUNISIA 2026</div>
  </div>
</body>
</html>
