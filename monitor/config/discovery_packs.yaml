# Geographic Combinations Settings
geographic_discovery:
  enabled: true
  top_issues: ["water", "electricity", "pollution_environment", "work_unemployment", "migration", "health", "protests_social_movements"]
  governorates:
    - slug: "tunis"
      aliases: { ar: ["تونس", "العاصمة"], fr: ["Tunis"], en: ["Tunis"] }
    - slug: "ariana"
      aliases: { ar: ["أريانة", "التضامن", "سكرة"], fr: ["Ariana", "Ettadhamen"], en: ["Ariana"] }
