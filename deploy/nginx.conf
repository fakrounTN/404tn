# deploy/nginx.conf
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for unprivileged execution
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/access.log main;
    error_log /tmp/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Healthcheck endpoint
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }

        # Trailing slash normalization: redirect /path/ to https://404tn.com/path (preserving query args)
        # Explicit HTTPS apex origin prevents leakage of internal upstream port/protocol
        # Root '/' is preserved and not matched
        rewrite ^/(.+)/$ https://404tn.com/$1 permanent;

        # Cache Policy: HTML entrypoints must revalidate
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Cache Policy: Static hashed bundles cache for 1 year
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Static GeoJSON and Datasets
        location ~* \.(?:geojson|json)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        # API passthrough boundary safety (Caddy routes /api in production)
        location /api/ {
            return 404;
        }

        # Gate 4: Prerender route serving + True HTTP 404
        # Resolves prerendered subpath index ($uri/index.html) first to prevent directory-slash redirects,
        # then exact static files ($uri), otherwise returns true 404
        location / {
            try_files $uri/index.html $uri =404;
        }

        # True 404 error handler
        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header X-Robots-Tag "noindex, follow" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }
}
